# Fields of the DRAM word; bit numbers as in the microcode (ks10, "DISPATCH ROM
# DEFINITIONS"). ROUND, MODE and FL-B are names for bits of field B.

[dram.A]
bits = [2, 5]
values = { READ = 0o0, WRITE = 0o1, DREAD = 0o2, DBLAC = 0o3, SHIFT = 0o4, DSHIFT = 0o5, FPI = 0o6, FP = 0o7, RD-PF = 0o10, DFP = 0o11, IOT = 0o12 }

[dram.B]
bits = [8, 11]
values = { SELF = 0o4, DBLAC = 0o5, DBLB = 0o6, AC = 0o15, MEM = 0o16, BOTH = 0o17 }

[dram.ROUND]
bits = [8, 8]

[dram.MODE]
bits = [9, 9]

[dram.FL-B]
bits = [10, 11]
values = { AC = 0o1, MEM = 0o2, BOTH = 0o3 }

[dram.J]
bits = [12, 23]

[dram.ACDISP]
bits = [24, 24]

[dram.I]
bits = [25, 25]

[dram.READ]
bits = [26, 26]

[dram.TEST]
bits = [27, 27]

[dram.COND_FUNC]
bits = [28, 28]

[dram.VMA]
bits = [29, 29]
default = 1

[dram.WRITE]
bits = [30, 30]
