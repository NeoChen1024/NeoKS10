# Implementation differences of the KS10 with the ITS microcode: one case
# for each behaviour in which the implementations differ. This file is the
# only list of these cases (AGENTS.md, "Sources of truth"). spec/gen_impldef.py
# checks it and writes docs/impldef.md. docs/conformance.md gives the levels.
#
# A case comes from a section of docs/discrepancies.md (`discrepancy`, the
# heading), from an item of docs/unknowns.md (`unknown`, a part of its
# text), or from docs/emulator.md, "Differences from the microcode"
# (`difference`, a part of its text). Do not add a case without one of them.
# A case never takes a value from the code under test: each `does` comes
# from its source.
#
# case:
#   name          a short name (lower case, digits, "-")
#   title         one line
#   area          "processor" or "device"
#   level         "A": the PRM or a DEC diagnostic defines the behaviour, or
#                 ITS relies on it; a case is here because an implementation
#                 differs from it. "B": implementation-defined; each core
#                 selects a behaviour. "open": not classified yet.
#   level_b       for level "B": why the PRM does not define the behaviour
#                 and no DEC diagnostic checks it (docs/conformance.md)
#   state         "open", "decided", or "confirmed" (on a real KS10)
#   instructions  mnemonics of spec/instructions.toml (processor cases)
#   when          the operands of the case: a predicate of the vocabulary of
#                 gen_impldef.py (PREDICATES) and its parameters
#   differs       the state that differs: "ac", "mem", "pc", "flags:N,N",
#                 "pfw:B-B" (bits of the page fail word), "register"
#   sources       what each source does: who, mark (an evidence mark of
#                 AGENTS.md), ref (file and label; a schematic with "rev"),
#                 does
#   choice        processor: uop, soft, pipelined; device: machine
#   compare       each differential run: simh, klh10 (against
#                 ks10-core-soft), uop_soft. "exact", "mask" (the fields of
#                 `differs` are not compared), "skip" (the case is not
#                 compared), or "not-generated" (the run makes no such case)
#   program       a minimal guest program in MIDAS syntax that separates
#                 the behaviours (docs/conformance.md, "A test on a real
#                 KS10"). The programs are not assembled or run yet.
#   note          optional

format = 1

[[case]]
name = "aprid"
title = "The APRID word"
area = "processor"
level = "open"
state = "decided"
discrepancy = "APRID of the ITS microcode"
instructions = ["APRID"]
when = { pred = "any" }
differs = ["mem"]
sources = [
  { who = "microcode", mark = "microcode", ref = "inout.50, APRID; its.15 UCV, HWOPT, HWSER; ks10.47 OPT", does = "020406,,003301" },
  { who = "SIMH", mark = "emulator", ref = "sims 9556eca0, pdp10-ks, set cpu its", does = "DSKCA prints CPU#=4097, MCV=416, MCO=570" },
]
choice = { uop = "microcode", soft = "microcode", pipelined = "open" }
compare = { simh = "not-generated", klh10 = "not-generated", uop_soft = "not-generated" }
program = """
	APRID 100		; C(100) <- the processor ID
	HALT .
"""

[[case]]
name = "pi-request-off-level"
title = "A program interrupt request on a level that is off"
area = "processor"
level = "open"
state = "decided"
discrepancy = "Program interrupt requests on levels that are off"
instructions = ["WRPI"]
when = { pred = "any" }
differs = ["pc"]
sources = [
  { who = "PRM", mark = "manual", ref = "PRM 1982, 4.1, WRPI bits 24 and 26", does = "the request counts also on a level that is off" },
  { who = "microcode", mark = "microcode", ref = "inout.50, LOADPI", does = "a program request counts only on a level that is on" },
]
choice = { uop = "microcode", soft = "microcode", pipelined = "open" }
compare = { simh = "not-generated", klh10 = "not-generated", uop_soft = "not-generated" }
program = """
	MOVE 1,[JSR INT]
	MOVEM 1,42		; the instruction of level 1 (EPT at 0)
	MOVEI 2,1
	WRPI 4300		; PI on, a request on level 1; level 1 stays off
	JFCL
	HALT .			; AC 2 = 1: no interrupt
INT:	0
	MOVEI 2,2		; AC 2 = 2: the interrupt came
	HALT .
"""

[[case]]
name = "rdubr-bits-0-2"
title = "Bits 0 and 2 of the RDUBR word before a WRUBR sets them"
area = "processor"
level = "open"
state = "decided"
discrepancy = "Bits 0 and 2 of the RDUBR word"
instructions = ["RDUBR"]
when = { pred = "any" }
differs = ["mem"]
sources = [
  { who = "KSDEFS", mark = "its", ref = "ksdefs.194, RDUBR", does = "always returns 4.9 and 4.7 set" },
  { who = "microcode", mark = "microcode", ref = "inout.50, WRUBR, RDUBR", does = "UBR AND 507703,,777777: the bits are 0 until a WRUBR sets them" },
]
choice = { uop = "microcode", soft = "microcode", pipelined = "open" }
compare = { simh = "not-generated", klh10 = "not-generated", uop_soft = "not-generated" }
program = """
	RDUBR 100		; after a reset, before any WRUBR
	HALT .
"""
note = "ITS sets both bits with each WRUBR, so the sources agree for ITS."

[[case]]
name = "movsrj-ac"
title = "EXTEND MOVSRJ: the AC at the end"
area = "processor"
level = "open"
state = "decided"
discrepancy = "The AC of MOVSRJ at the end"
instructions = ["EXTEND"]
when = { pred = "any" }
differs = ["ac"]
sources = [
  { who = "PRM", mark = "manual", ref = "PRM 1982, 2.12, MOVSRJ", does = "AC bits 9-35 hold the number of source bytes skipped" },
  { who = "microcode", mark = "microcode", ref = "extend.4, MVSKP, MOVST3", does = "AC bits 9-35 are 0" },
]
choice = { uop = "microcode", soft = "microcode", pipelined = "open" }
compare = { simh = "not-generated", klh10 = "not-generated", uop_soft = "not-generated" }
program = """
	MOVEI 1,5		; source: 5 bytes
	MOVE 2,[440700,,SRC]
	MOVEI 4,3		; destination: 3 bytes
	MOVE 5,[440700,,DST]
	EXTEND 1,[017000,,0	; MOVSRJ
		  0]		; fill
	HALT .			; AC 1: 2 skipped bytes, or 0
SRC:	ASCII /ABCDE/
DST:	0
"""

[[case]]
name = "fad-large-exponent-difference"
title = "FAD with an exponent difference of 54 or more"
area = "processor"
level = "open"
state = "decided"
discrepancy = "FAD with a large exponent difference"
instructions = ["FAD"]
when = { pred = "exponent_difference_over", n = 60 }
differs = ["ac"]
sources = [
  { who = "PRM", mark = "manual", ref = "PRM 1982, 2.3, footnote to FAD", does = "0 for the smaller operand above 72; from 54 to 72 a negative operand becomes all ones" },
  { who = "microcode", mark = "microcode", ref = "flt.5, FAD to FAS4", does = "the full shift; a negative operand always becomes all ones" },
  { who = "SIMH", mark = "emulator", ref = "sims 9556eca0, kx10_cpu.c, FAD", does = "0 for a difference of 65 or more" },
]
choice = { uop = "microcode", soft = "microcode", pipelined = "open" }
compare = { simh = "not-generated", klh10 = "not-generated", uop_soft = "not-generated" }
program = """
	MOVE 1,[201400,,0]	; 1.0
	FAD 1,[700400,,0]	; -2^-66: an exponent difference of 66
	HALT .
"""
note = "The differential run makes exponent differences of 60 or less for all floating point instructions (oracle.rs, near)."

