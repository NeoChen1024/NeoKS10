[[case]]
name = "dmul-carry"
title = "DMUL: the carry flags of QMULT"
area = "processor"
level = "B"
level_b = "The PRM names Overflow and Trap 1 for (-2^70)^2 and no carry flag for DMUL (PRM 1982, p. 2-16). DSKCF checks only Overflow after DMUL: MULTF tests the PC word with TLZE SCR2,AROV (DSKCFT, DMUL - TEST C), and DMUL - TEST E expects Overflow for (-2^70)^2. No DEC diagnostic tests the carry flags (a reading of the KLAD sources, 2026-11-28)."
state = "decided"
discrepancy = "DMUL: the carry flags of QMULT"
instructions = ["DMUL"]
when = { pred = "any" }
differs = ["flags:CRY0,CRY1"]
sources = [
  { who = "microcode", mark = "microcode", ref = "simple.42, DMUL, DMUL2, QMULT; M8620-0-DPE9 rev A1, E305", does = "Carry 0 and Carry 1 if a high part is negative" },
  { who = "SIMH", mark = "emulator", ref = "sims 9556eca0, kx10_cpu.c, DMUL", does = "Overflow and Trap 1 for (-2^70)^2; no carry flag" },
  { who = "KLH10", mark = "emulator", ref = "KLH10 6d733f2, kn10ops.c, op10dmul", does = "as SIMH" },
]
