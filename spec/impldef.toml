[[case]]
name = "fdv-quotient"
title = "FDV with normalized operands: bit 35 of the quotient"
area = "processor"
level = "A"
state = "open"
discrepancy = "FDV: the quotient"
instructions = ["FDV", "FDVL", "FDVM", "FDVB", "FDVR", "FDVRI", "FDVRM", "FDVRB"]
when = { pred = "any" }
differs = ["ac", "mem"]
sources = [
  { who = "DSKCB", mark = "manual", ref = "DSKCB.SEQ page 32, test P7700", does = "an unnormalized divisor: 777375,,773771" },
  { who = "uop", mark = "measured", ref = "2026-11-28, ks10-core-uop, tests/instructions.rs, fdv_quotients_of_the_microcode", does = "the quotient of ks10-core-soft and KLH10 in four cases" },
  { who = "SIMH", mark = "measured", ref = "2026-11-27, sims 9556eca0, oracle.rs without skip", does = "744 of 2075 cases differ in bit 35; FDVRB with a dividend of 0 leaves E unchanged" },
  { who = "KLH10", mark = "measured", ref = "2026-11-27, KLH10 6d733f2a", does = "agrees with ks10-core-soft in 2123 cases" },
]
choice = { uop = "microcode", soft = "microcode", pipelined = "open" }
compare = { simh = "skip", klh10 = "exact", uop_soft = "exact" }
