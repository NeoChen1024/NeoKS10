	MOVE 1,[152653,,256164]
	FDV 1,[631006,,651626]	; 573116,,702671 or 573116,,702672
	HALT .
"""
note = "Level A, open until a source decides it (docs/conformance.md). The SIMH skip covers all FDV cases, not only those that differ."

