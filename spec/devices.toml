# The registers of the KS10 I/O devices: the Unibus adapters, the memory
# status register, and the Unibus devices (RH11 with RP06, RH11 with TM03,
# DZ11).
#
# This is the only definition of these registers in the repository
# (AGENTS.md, "Sources of truth"). spec/gen_devices.py writes the Rust
# constants (emu/ks10-machine/src/devregs.rs) and docs/devices.md from it.
# `gen_devices.py --check --its DIR` compares every entry that has an
# `its` name with the value of that symbol in the ITS system sources
# (src/system/ of the ITS tree).
#
# Addresses and offsets are octal. A Unibus register offset is in bytes
# from the base address of the device. Fields: `lsb` is the number of the
# low bit (0 = the low bit of the 16-bit register), `width` the number of
# bits (default 1). `bp = true`: the ITS symbol is the left half of a byte
# pointer (position, size) and not a mask. `lh = true`: the ITS symbol is a
# left half value.

[[device]]
name = "uba"
title = "Unibus adapter"
source = "ksdefs.194"
# The adapter registers are at KS10 I/O addresses, one register for each
# address (not Unibus byte addresses).
registers = [
  { name = "PAGE", its = "UBAPAG", addr = 0o763000, count = 64, title = "Paging RAM (UBALEN entries)" },
  { name = "STA", its = "UBASTA", addr = 0o763100, title = "Status" },
  { name = "MNT", its = "UBAMNT", addr = 0o763101, title = "Maintenance" },
]

[[device.fields]]
register = "PAGE"
# A paging RAM entry as written (left side) and as read (right side) have
# different formats (ksdefs.194, %UQ and %UP). Bit numbers here are of the
# 36-bit word, from bit 35 = lsb 0.
fields = [
  { name = "W_RPW", lsb = 17, its = "%UQRPW", title = "Written: force read-pause-write" },
  { name = "W_16B", lsb = 16, its = "%UQ16B", title = "Written: disable the upper two Unibus bits" },
  { name = "W_FST", lsb = 15, its = "%UQFST", title = "Written: fast mode" },
  { name = "W_VAL", lsb = 14, its = "%UQVAL", title = "Written: entry is valid" },
  { name = "W_PAGE", lsb = 0, width = 11, title = "Written: DEC page number (ITS page and half page)" },
  { name = "R_PAR", lsb = 31, its = "%UPPAR", lh = true, title = "Read: RAM parity bit" },
  { name = "R_RPW", lsb = 30, its = "%UPRPW", lh = true, title = "Read: force read-pause-write" },
  { name = "R_16B", lsb = 29, its = "%UP16B", lh = true, title = "Read: disable the upper two Unibus bits" },
  { name = "R_FST", lsb = 28, its = "%UPFST", lh = true, title = "Read: fast mode" },
  { name = "R_VAL", lsb = 27, its = "%UPVAL", lh = true, title = "Read: entry is valid" },
  { name = "R_PVL", lsb = 26, its = "%UPPVL", lh = true, title = "Read: parity is valid" },
  { name = "R_PAGE", lsb = 9, width = 11, title = "Read: DEC page number (bits 3.2 to 2.1)" },
]

[[device.fields]]
register = "STA"
fields = [
  { name = "TIM", lsb = 17, its = "%UBTIM", title = "Unibus timeout (R/C)" },
  { name = "BAD", lsb = 16, its = "%UBBAD", title = "Bad memory data on an NPR transfer (R/C)" },
  { name = "PAR", lsb = 15, its = "%UBPAR", title = "KS10 bus parity error (R/C)" },
  { name = "NXD", lsb = 14, its = "%UBNXD", title = "CPU addressed a nonexistent device (R/C)" },
  { name = "HIG", lsb = 11, its = "%UBHIG", title = "Interrupt request on BR7 or BR6 (R)" },
  { name = "LOW", lsb = 10, its = "%UBLOW", title = "Interrupt request on BR5 or BR4 (R)" },
  { name = "PWR", lsb = 9, its = "%UBPWR", title = "Power low (R, cleared by any write)" },
  { name = "DXF", lsb = 7, its = "%UBDXF", title = "Disable transfer on uncorrectable data (R/W)" },
  { name = "INI", lsb = 6, its = "%UBINI", title = "Issue Unibus init (W)" },
  { name = "PIH", lsb = 3, width = 3, its = "%UBPIH", title = "PI level for BR7 and BR6 (R/W)" },
  { name = "PIL", lsb = 0, width = 3, its = "%UBPIL", title = "PI level for BR5 and BR4 (R/W)" },
]

[[device]]
name = "memctl"
title = "Memory controller"
source = "ksdefs.194"
registers = [
  { name = "STATUS", its = "KSECCS", addr = 0o100000, title = "Memory status register (controller 0, adapter 0)" },
]

[[device.fields]]
register = "STATUS"
fields = [
  { name = "HLD", lsb = 35, its = "%KEHLD", lh = true, title = "Error held (R/C)" },
  { name = "UNC", lsb = 34, its = "%KEUNC", lh = true, title = "Uncorrectable error (R)" },
  { name = "REF", lsb = 33, its = "%KEREF", lh = true, title = "Refresh error (R/C)" },
  { name = "PAR", lsb = 32, its = "%KEPAR", lh = true, title = "Parity error (R/W)" },
  { name = "ENA", lsb = 31, its = "%KEENA", lh = true, title = "ECC enabled (R)" },
  { name = "ECC", lsb = 24, width = 7, its = "%KEECC", lh = true, title = "ECC bits (R)" },
  { name = "PWR", lsb = 23, its = "%KEPWR", lh = true, title = "Backup power low (R/C)" },
  # EK-OKS10-TM-002 figure 5-30; the right half has no ITS name.
  { name = "ERA", lsb = 0, width = 22, title = "Error address: bits 14-35 of the last command/address cycle (R)" },
  { name = "FRC", lsb = 1, width = 7, title = "Force check bits CP, C40, C20, C10, C04, C02, C01 (W)" },
  { name = "OFF", lsb = 0, title = "Disable error correction (W)" },
]

[[device]]
name = "rh11"
title = "RH11 Massbus controller and RP06 disk drive"
