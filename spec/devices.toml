# Register addresses in the ITS source include the base of the disk RH11;
# the check subtracts the base of the instance "disk".
base_instance = "disk"
registers = [
  { name = "CS1", its = "%HRCS1", offset = 0o0, title = "Control and status 1" },
  { name = "WC", its = "%HRWC", offset = 0o2, title = "Word count" },
  { name = "BA", its = "%HRBA", offset = 0o4, title = "Unibus address" },
  { name = "DA", its = "%HRADR", offset = 0o6, title = "Desired address (track, sector)" },
  { name = "CS2", its = "%HRCS2", offset = 0o10, title = "Control and status 2" },
  { name = "DS", its = "%HRSTS", offset = 0o12, title = "Drive status" },
  { name = "ER1", its = "%HRER1", offset = 0o14, title = "Error 1" },
  { name = "AS", its = "%HRATN", offset = 0o16, title = "Attention summary" },
  { name = "LA", its = "%HRLAH", offset = 0o20, title = "Look ahead" },
  { name = "DB", its = "%HRBUF", offset = 0o22, title = "Data buffer" },
  { name = "MR", its = "%HRMNT", offset = 0o24, title = "Maintenance" },
  { name = "DT", its = "%HRTYP", offset = 0o26, title = "Drive type" },
  { name = "SN", its = "%HRSER", offset = 0o30, title = "Serial number" },
  { name = "OF", its = "%HROFS", offset = 0o32, title = "Offset" },
  { name = "DC", its = "%HRCYL", offset = 0o34, title = "Desired cylinder" },
  { name = "CC", its = "%HRCCY", offset = 0o36, title = "Current cylinder" },
  { name = "ER2", its = "%HRER2", offset = 0o40, title = "Error 2" },
  { name = "ER3", its = "%HRER3", offset = 0o42, title = "Error 3" },
]

[[device.fields]]
register = "CS1"
fields = [
  { name = "SC", lsb = 15, its = "%HXSC", title = "Special condition" },
  { name = "TRE", lsb = 14, its = "%HXTRE", title = "Transfer error" },
  { name = "MCPE", lsb = 13, its = "%HXMCP", title = "Massbus control bus parity error" },
  { name = "DVA", lsb = 11, its = "%HXDVA", title = "Drive available" },
  { name = "PSEL", lsb = 10, its = "%HXPSE", title = "Port select" },
  { name = "A17", lsb = 9, its = "%HXA17", title = "Unibus address bit 17" },
  { name = "A16", lsb = 8, its = "%HXA16", title = "Unibus address bit 16" },
  { name = "RDY", lsb = 7, its = "%HXRDY", title = "Ready" },
  { name = "IE", lsb = 6, its = "%HXIE", title = "Interrupt enable" },
  { name = "CMD", lsb = 0, width = 6, its = "$HXCMD", title = "Function code with GO" },
  { name = "GO", lsb = 0, its = "%HXGO", title = "Go" },
]

# The masks of rh11.defs48 are the sizes of the RP07; the RP06 uses fewer
# bits of them (rh11.defs48, %HRADR).
[[device.fields]]
register = "DA"
fields = [
  { name = "TRK", lsb = 8, width = 6, its = "$HATRK", title = "Track" },
  { name = "SEC", lsb = 0, width = 7, its = "$HASEC", title = "Sector" },
