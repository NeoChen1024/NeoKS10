[package]
name = "neoks10"
version = "0.1.0"
description = "The neoks10 program: configuration, operator console, control socket, scripts"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
ks10 = { path = "../ks10" }
pdp10 = { path = "../pdp10" }
crossterm = { version = "0.29.0", default-features = false, features = ["events"] }
reedline = "0.53.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
toml = "1.2.3"
