[workspace]
resolver = "3"
members = ["pdp10", "ks10-machine", "ks10-core-soft", "ks10-core-uop", "plio", "memprobe", "neoks10"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
