[workspace]
resolver = "3"
members = ["pdp10", "ks10-machine", "ks10-core-soft", "ks10-core-uop", "ks10-capi", "ks10-csl", "plio", "memprobe", "neoks10"]

[workspace.package]
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }

# The tests of the microcode-level model run millions of microcycles
# (`make microcode`). The crates of their inner loop are optimized also
# in the dev profile; overflow checks and debug assertions stay on.
[profile.dev.package.ks10-core-uop]
opt-level = 3

[profile.dev.package.ks10-core-soft]
opt-level = 3

[profile.dev.package.ks10-machine]
opt-level = 3

[profile.dev.package.pdp10]
opt-level = 3

# One code unit and fat LTO, so that the small functions of one crate
# inline into the inner loop of another (the devices of ks10-machine in
# the steps of ks10-core-soft). `make mips` before and after are in the
# commit message that added them.
[profile.release]
lto = "fat"
codegen-units = 1
